<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/tailwind.css">
    <link rel="icon" href="assets/favicon.ico" type="image/x-icon">
    <title>Receipt Your Day</title>
    <script src="js/todo.js" defer></script>
    <style>
        @font-face {
            font-family: "Fake Receipt";
            src: url("assets/fonts/Fake%20Receipt.otf") format("opentype");
            font-display: swap;
        }
    </style>
</head>

<body class="mx-2 mt-[100px] flex min-h-fit items-center justify-center bg-[#c5d4cb] font-['Fake_Receipt']">
    <main>
        <div class="box-content min-h-fit min-w-[300px] bg-[url('../assets/image.png')] bg-auto bg-center p-[40px]">
            <h1 class="my-[0.35em] flex justify-center text-center text-[2em] font-bold">A Bill for a Day</h1>
            <p id="current-date" class="my-4 flex justify-center"></p>
            <p class="my-4 flex justify-center">- - - - - - - - - - - - - - - - - -</p>
            

            <section class="flex items-center justify-center">
                <button type="button" id="allBtn" class="m-auto flex cursor-pointer appearance-none items-center justify-center border-0 bg-transparent transition-colors duration-150 hover:text-[#758d7e]">All</button>
                <button type="button" id="activeBtn" class="m-auto flex cursor-pointer appearance-none items-center justify-center border-0 bg-transparent transition-colors duration-150 hover:text-[#758d7e]">Active</button>
                <button type="button" id="doneBtn" class="m-auto flex cursor-pointer appearance-none items-center justify-center border-0 bg-transparent transition-colors duration-150 hover:text-[#758d7e]">Done</button>
            </section>

            <p class="my-4 flex justify-center">- - - - - - - - - - - - - - - - - -</p>

            <ol class="my-4 list-[decimal-leading-zero] pl-10 justify-center" id="todo-items">

            </ol>

            <p class="my-4 flex justify-center">- - - - - - - - - - - - - - - - - -</p>

            <form name="frmTodo" class="flex items-center justify-center gap-2 pb-5">
                <input type="text" size="32" name="todoText" placeholder="Enter items...">
                <button type="submit" id="addBtn" class="cursor-pointer appearance-none border-0 bg-transparent transition-colors duration-150 hover:text-[#758d7e]">+</button>
            </form>

            <div class="flex justify-between">
                <span id="completed-count">0 task completed</span>
                <button type="button" id="clearBtn" class="cursor-pointer appearance-none border-0 bg-transparent p-0 shadow-none transition-colors duration-150 hover:text-[#758d7e]" data-action="clearAll">clear completed</button>
            </div>

            <p class="my-4 flex justify-center">- - - - - - - - - - - - - - - - - -</p>
            <div class="flex justify-center">
                <img src="assets/barcode.png" alt="Barcode" class="h-[45px] w-[300px] object-fill">
            </div>
            <p class="my-4 flex justify-center">- - - - - - - - - - - - - - - - - -</p>
            <p class="my-4 flex justify-center">valid until today</p>
        </div>
    </main> 

    <script type="text/html" id="tpl-item">
        <li>
            <div class="flex w-full items-center justify-between">
                <div class="flex items-center gap-4">
                    <input type="checkbox" data-action="toggle" data-uid="${uid}" ${checked}>
                    <span>${content}</span>
                </div>
                    <div class="flex items-center gap-2"> 
                        <button type="button" data-action="edit" class="hover:text-[#008B8B]" data-uid="${uid}">E</button>
                    <button type="button" data-action="remove" class="hover:text-[#DC143C]" data-uid="${uid}">x</button>
                </div>
            </div>
        </li>
    </script>

</body>
</html>
