<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List!</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
    <script src="main.js"></script>
</head>

<body class="flex items-center bg-gray-200 font-sans  text-gray-900 fixed w-full h-full">
    <main id="todo-list" class="mx-auto max-auto max-w-md">

        <section id="todo-section1" class="rounded-3xl bg-white p-6 mb-4">
            <p id="todayText" class="text-[15px] font-medium text-gray-500"></p>
            <h1 class="mt-1 text-[26px] font-bold">오늘 할 일</h1>
            <div class="mt-5 flex justify-between text-[15px]">
                <span class="text-gray-500">진행률</span>
                <span id="progressText" class="font-semibold text-blue-500">0개 중 0개 완료</span>
            </div>
            <!-- 회색 막대(바깥) 위에 파란 막대(안쪽). 파란 막대 폭을 JS가 바꿈 -->
            <div id="progressbar" class="mt-2 h-2 overflow-hidden bg-gray-100 rounded-full">
                <div id="progressFill" class="h-full w-0 rounded-full bg-blue-500 transition-all duration-500"></div>
            </div>
        </section>

        <section id="todo-section2" class="rounded-3xl bg-white p-6">
            <form id="todoForm" class="flex gap-2">
                <label for="todoInput" class="sr-only">할 일 입력</label>
                <input type="text" id="todoInput" placeholder="할 일을 입력해 주세요." class="h-14 px-4 min-w-0 bg-gray-50 flex-1 rounded-2xl text-[17px] outline-none placeholder:text-gray-400 focus:ring-2
                focus:ring-blue-500 ">

                <button id="addButton" type="submit"
                    class="button-press h-14 px-5 bg-blue-500 font-semibold text-white rounded-2xl 
                hover:bg-blue-600 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-blue-500">추가</button>
            </form>
            <ul id="todoList" class="mt-4 flex flex-col">
            </ul>
            <p id="empty-message" class="py-10 text-center text-gray-400 text-[15px]">
                아직 할일이 없어요 <br>
                위에서 첫 할 일을 추가해 보세요.
            </p>
            <!-- 완료한 일이 있을 때만 보이는 버튼 -->
            <button id="clearButton" type="button"
                class="button-press mt-2 w-full rounded-2xl py-3 text-[15px] font-medium text-gray-500 hover:bg-gray-50">
                완료한 일 지우기
            </button>
        </section>
    </main>

    <!-- 할 일 1개 설계도 화면에 안 보임-->

            </label>
            <button type="button" class="text-gray-400 hover:text-gray-600">삭제</button>
        </li>
    </template> -->
</body>

</html>
